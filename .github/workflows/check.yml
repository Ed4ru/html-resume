name: Check

# Called by ci.yml.
on:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The checks do not generate a PDF: skip Puppeteer's browser download.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # The prepare script would install the Git hooks: not needed on CI.
      VP_GIT_HOOKS: '0'
    steps:
      # The setup action is a file of the repository: it only exists once the repository is checked out.
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Format, lint and type checks.
      - run: vp check

      # data/schema.json must match the Valibot schema in src/schema/.
      - run: vp run schema --check

      - run: vp build
