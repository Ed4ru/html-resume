name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The site does not need Puppeteer's browser.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # The prepare script would install the Git hooks: not needed on CI.
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v7

      # Installs Vite+, Node.js and the package manager, then runs `vp install` (run-install, on by
      # default, spelled out here). cache only restores and saves the package manager's store.
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          run-install: true
          cache: true

      # Bundles the page, its styles, fonts and uqr into dist/.
      - run: vp build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
