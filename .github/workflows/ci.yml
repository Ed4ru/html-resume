name: CI

# Runs on every push to a branch, and on pull requests, including from forks. A pull request from a
# branch of this repository runs twice: a job skipped by a condition would count as a passing
# required check, so the duplicate is not filtered out. main is left out: the ruleset only lets
# up-to-date branches that passed these checks be merged into it.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each job runs a workflow of this directory, from the same commit. Its status is named
  # `<job> / <job of the called workflow>`: `check / check`, `test / test`.
  check:
    uses: ./.github/workflows/check.yml

  # Skipped if check fails.
  test:
    needs: check
    uses: ./.github/workflows/test.yml
