allowBuilds:
  puppeteer: true

# Vite+ manual setup: other packages must use the Vite and Vitest copies shipped with vite-plus.
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 5.0.1

# Optional native canvas of pdfjs-dist, used to draw pages: the tests only read the PDF text.
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
